plugins {
    id 'java'
}

// Brigadier is not on Maven Central, so this lives outside of hmc-specifics-api.
// It is not a standalone build, version projects include it next to hmc-specifics-api.

group 'me.earth.headlessmc'
version "${project(':hmc-specifics-api').project_version}"

repositories {
    mavenCentral()
    maven {
        url "https://libraries.minecraft.net"
    }
}

try {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
} catch (ignored) { // gradle 9

}

compileJava {
    if (JavaVersion.current().ordinal() > JavaVersion.VERSION_1_8.ordinal()) {
        options.compilerArgs.addAll(['--release', '8'])
    }
}

dependencies {
    compileOnly 'com.mojang:brigadier:1.0.17' // old version for testing
    // compileOnly 'com.mojang:brigadier:1.2.9' // new version for testing
}
