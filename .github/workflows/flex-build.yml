name: Flex Build

"on":
  workflow_call:
    inputs:
      dir:
        description: Directory to build
        required: true
        type: string
      mc:
        description: Minecraft version
        type: string
      lex:
        description: LexForge version
        type: string
      neo:
        description: NeoForge version
        type: string
      java:
        description: Java version
        required: true
        type: string
      upload:
        description: Upload the build artifacts
        default: true
        type: boolean
      publish:
        description: Run Gradle publish
        default: false
        type: boolean

jobs:
  build: # TODO: add build attestation and generate then combine gradle dependency graphs for SBOM
    name: Build ${{ inputs.dir }}/${{ inputs.mc }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            hmc-specifics-api
            hmc-specifics-brigadier
            hmc-specifics-tweaker
            ${{ inputs.dir }}

      - name: Cache build
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ inputs.dir }}/build
          key: build-${{ inputs.mc }}-${{ hashFiles(format('{0}/[a-z]**', inputs.dir), 'hmc-specifics-api/**', 'hmc-specifics-brigadier/**', 'hmc-specifics-tweaker/**') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Checkout HeadlessMC v3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: headlesshq/headlessmc
          ref: hmc-specifics-v3 # TODO: use a released version of HeadlessMC v3
          path: HeadlessMC/headlessmc-code
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # the last version is the default, HeadlessMC v3 requires Java 25 to build
          java-version: |
            25
            ${{ inputs.java }}

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          workflow-job-context: '{}' # FIXME: avoid this cache duplication workaround

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Publish HeadlessMC v3 modules
        run: |
          chmod +x gradlew
          ./gradlew $(grep -v '^\s*$' ../../hmc-specifics-api/headlessmc-v3-modules.txt | sed 's/$/:publish/')
        working-directory: HeadlessMC/headlessmc-code
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - if: |
          steps.cache.outputs.cache-hit != 'true'
          && !inputs.release
        name: Give gradlew permissions
        run: chmod +x gradlew
        working-directory: ${{ inputs.dir }}

      - if: |
          steps.cache.outputs.cache-hit != 'true'
          && !inputs.release
        name: Gradle build
        run: >
          ./gradlew build --stacktrace
          -Pminecraft_version=${{ inputs.mc }}
          -Plexforge_version=${{ inputs.lex }}
          -Pneoforge_version=${{ inputs.neo }}
        working-directory: ${{ inputs.dir }}

      - if: inputs.upload
        name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jars-${{ inputs.mc || inputs.dir }}
          path: ${{ inputs.dir }}/build/libs/*.jar
