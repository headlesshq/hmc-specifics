name: Publish API to github packages

on:
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Checkout HeadlessMC v3
        uses: actions/checkout@v4
        with:
          repository: headlesshq/headlessmc
          ref: hmc-specifics-v3 # TODO: use a released version of HeadlessMC v3
          path: HeadlessMC/headlessmc-code
          fetch-depth: 1
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v4
        with:
          # the last version is the default, JLine 4 requires Java 11, HeadlessMC v3 requires Java 25 to build
          java-version: |
            25
            17
          distribution: temurin
      - name: Publish HeadlessMC v3 modules
        working-directory: ./HeadlessMC/headlessmc-code
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x gradlew
          ./gradlew $(grep -v '^\s*$' ../../hmc-specifics-api/headlessmc-v3-modules.txt | sed 's/$/:publish/')
      - name: Grant execute permission for gradlew
        working-directory: ./hmc-specifics-api
        run: chmod +x gradlew
      - name: Publish with gradle
        working-directory: ./hmc-specifics-api
        env:
          IS_MAVEN_PUB: true
          DEPLOY_TO_GITHUB_PACKAGES_URL: https://maven.pkg.github.com/headlesshq/hmc-specifics
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew publish
