name: Lifecycle

"on":
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      dirs:
        description: Comma-delimited directories to build and run (i.e. hmc-specifics-api,1_20,1_21 )
        default: "all"
      ref:
        description: Git ref to checkout before build (i.e. my-feature-branch )
        default: "main"

concurrency: # FIXME: prevent release commit cancellation
  group: >
    ${{ github.workflow }}-
    ${{ github.event_name }}-
    ${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  HMC_VERSION: 3.0.0-RC2

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - if: github.event_name == 'push' # TODO: explicit on push to main
        id: release-please
        name: Run Release Please
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  matrices:
    if: github.event.action != 'closed'
    name: Construct matrices
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.matrices.outputs.build-matrix }}
      run-matrix: ${{ steps.matrices.outputs.run-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.ref || github.ref }}

      - if: github.event_name != 'workflow_dispatch'
        id: paths
        name: Get paths
        run: |
          { delimiter="$(openssl rand -hex 8)"
          echo "filter<<${delimiter}"
          for dir in $(find . -maxdepth 1 -type d -not -path "./.git*" -print | cut -d/ -f2-); do
            echo "'$dir' : ['$dir/**']"
          done; echo "${delimiter}"; } >> "${GITHUB_OUTPUT}"
          echo "${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}" || true

      - if: github.event_name != 'workflow_dispatch'
        id: filter
        name: Filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            ${{ steps.paths.outputs.filter }}

      - id: matrices # TODO: build origin matrices dynamically, consider collapsing this into a .py
        name: Construct matrices
        env:
          PR_COMMENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          import os
          import json
          import re

          build_matrix = {"include": []}
          run_matrix = {"version": []}

          with open('ci-data.json') as f:
              ci_data = json.load(f)
          
          build_data = ci_data['build_data']
          run_data = ci_data['run_data']

          dirs_to_filter = []
          mc_versions = []

          match os.getenv('GITHUB_EVENT_NAME'):
            case 'pull_request':
              if "${{ steps.filter.outcome }}" == "success":
                # Filter matrices based on the detected changes
                dirs_to_filter = json.loads('${{ steps.filter.outputs.changes }}')
                comment_body = os.getenv('PR_COMMENT_BODY')
                print("PR-comment:", comment_body)
                if comment_body:
                  pattern = r'Automatic commit: build and run ([0-9\.]*[0-9]*) in ([0-9_]*[0-9]*)'
                  matches = re.findall(pattern, comment_body)
                  if matches:
                    mc_versions = []
                    dirs_to_filter = []
                    for version, directory in matches:
                      mc_versions.append(version)
                      dirs_to_filter.append(directory)
                    print('Matched PR body', mc_versions, dirs_to_filter)
                  else:
                    print('PR body did not match')

            case 'workflow_dispatch':
              input_dirs = '${{ github.event.inputs.dirs }}'
              print(input_dirs)
              if input_dirs == 'all':
                # If "all" is specified in the input, run all possible builds and runs
                build_matrix['include'], run_matrix['version'] = build_data, run_data
                print(build_matrix)
                print(run_matrix)
              else:
                # Otherwise, filter based on the directories listed in the input
                dirs_to_filter = [item.strip() for item in input_dirs.split(',')]

            case 'push':
              if '${{ needs.release-please.outputs.release_created }}' == 'true':
                # If a release is created, use the full matrices
                build_matrix['include'], run_matrix['version'] = build_data, run_data

          if dirs_to_filter:
            build_matrix['include'].extend([item for item in build_data if item["dir"] in dirs_to_filter and ("mc" not in item or (item["mc"] in mc_versions or not mc_versions))])
            mc_versions = mc_versions if mc_versions else [item.get("mc") for item in build_matrix["include"] if "mc" in item]          
            run_matrix['version'].extend([item for item in run_data if item["mc"] in mc_versions])

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(json.dumps(build_matrix, indent=2))
            fh.write(f'build-matrix={json.dumps(build_matrix)}\n')
            print(json.dumps(run_matrix, indent=2))
            fh.write(f'run-matrix={json.dumps(run_matrix)}\n')
        shell: python {0}

  build:
    if: fromJSON(needs.matrices.outputs.build-matrix).include[0] != null
    name: Build
    needs: matrices
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJSON(needs.matrices.outputs.build-matrix) }}
    uses: ./.github/workflows/flex-build.yml
    with:
      dir: ${{ matrix.dir }}
      mc: ${{ matrix.mc }}
      lex: ${{ matrix.lex }}
      neo: ${{ matrix.neo }}
      java: ${{ matrix.java }}

  run:
    if: github.event_name != 'push' && fromJSON(needs.matrices.outputs.run-matrix).version[0] != null
    name: Run tests
    needs:
      - matrices
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ${{ insert }}: ${{ fromJSON(needs.matrices.outputs.run-matrix) }}
        xvfb: [false]
    steps:
      - name: Checkout # TODO: simplify away this step, currently needed for `uses: ./`
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jars-${{ matrix.version.mc }}

      - name: Bootstrap mods
        run: |
          mkdir -p run/mods
          cp hmc-specifics-*-${{ matrix.version.type }}-release.jar run/mods

      - name: Setup Java temurin-${{ matrix.version.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.version.java }}
          distribution: temurin

      # TODO: check configuration!
      - name: Bootstrap HeadlessMC
        run: |
          mkdir -p HeadlessMC run/mods
          cat <<EOF >> HeadlessMC/config.properties
          hmc.java.versions=$JAVA_HOME
          hmc.files.mc=$HOME/.minecraft
          hmc.files.game=$PWD/run
          hmc.assets.dummy=true
          hmc.files.game-for-each-version=false
          hmc.jline.enabled=false
          hmc.test.file=./hmc-specifics-test.json
          hmc.log.console-level=INFO
          EOF
          echo "HMC_FILES_LOCATION=$PWD/HeadlessMC" >> "$GITHUB_ENV"
        shell: bash

      - name: Get HeadlessMC
        uses: robinraju/release-downloader@a96f54c1b5f5e09e47d9504526e96febd949d4c2 # v1.11
        with:
          repository: 3arthqu4ke/headlessmc
          tag: ${{ env.HMC_VERSION }}
          fileName: headlessmc-launcher-linux-x64

      - name: Make HeadlessMC executable
        run: chmod +x headlessmc-launcher-linux-x64
        shell: bash

      - name: Cache Minecraft
        uses: actions/cache@v4
        with:
          path: /home/runner/.minecraft
          key: ${{ matrix.version.mc }}-${{ matrix.version.modloader }}-hmc

      - name: Download ${{ inputs.modloader }}-${{ inputs.mc }}
        run: |
          ./headlessmc-launcher-linux-x64 version install ${{ inputs.modloader }} ${{ inputs.mc }}
        shell: bash

      - name: Configure game
        run: |
          cat <<EOF >> run/options.txt
          onboardAccessibility:false
          pauseOnLostFocus:false
          EOF
        shell: bash

      - name: Run game
        run: ./headlessmc-launcher-linux-x64 launch -lwjgl --offline --retries 3 --jvm "-Djava.awt.headless=true -Dhmc.jline.enabled=false" ${{ inputs.modloader }} ${{ inputs.mc }}

  release:
    if: needs.release-please.outputs.release_created == 'true'
    needs:
      - release-please
      - build
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Upload release artifacts
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-release.jar
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

      - name: Upload api artifacts
        uses: svenstaro/upload-release-action@04733e069f2d7f7f0b4aebc4fbdbce8613b03ccd # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: jars-*/*-api-*.jar # TODO: make API jar names consistent with release jars, then simplify away this step
          tag: ${{ needs.release-please.outputs.tag_name }}
          overwrite: true
          file_glob: true

  clean: # TODO: run this conditionally per #22
    name: Clean up
    needs:
      - run
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: |
            jars-*
          failOnError: false

  claude-fix:
    name: Claude fix
    needs: [ build, run ]
    # TODO: this only run Claude once when the PR is opened and fails
    #   however, Claude cannot react to if the mc-runtime-test fails
    #   The prompt instructs Claude to use the headlessmc skill to test,
    #   but we cannot be sure it does. Check next PR this happens!
    if: >
      !cancelled() &&
      contains(needs.*.result, 'failure') &&
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      startsWith(github.head_ref, 'version-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # PAT so the push triggers CI again; GITHUB_TOKEN pushes don't
          token: ${{ secrets.PR_TOKEN }}

      - name: Determine Java version of the new Minecraft version
        id: java
        # mc-update-helper inserts the new version as the first versioned entry
        run: echo "version=$(jq -r '[.build_data[] | select(.mc)][0].java' ci-data.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure git
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Fix with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PR_TOKEN }}
          plugin_marketplaces: https://github.com/headlesshq/headlessmc-skill.git
          plugins: headlessmc@headlesshq
          claude_args: >-
            --max-turns 120                                                                                                                                                                                                                                                                                       
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,Skill"
          prompt: |
            Pull request #${{ github.event.pull_request.number }} on branch `${{ github.head_ref }}`                                                                                                                                                                                                              
              was opened automatically by mc-update-helper to add support for a new Minecraft version.                                                                                                                                                                                                              
              It copied the project directory of the previous version and bumped versions in                                                                                                                                                                                                                        
              gradle.properties, fabric.mod.json, mods.toml, ci-data.json and the README.                                                                                                                                                                                                                           
            
              The CI run failed:                                                                                                                                                                                                                                                                                    
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}                                                                                                                                                                                                                   
              - build: ${{ needs.build.result }}                                                                                                                                                                                                                                                                    
              - run (runtime tests): ${{ needs.run.result }}                                                                                                                                                                                                                                                        
            
              You have the `headlessmc` skill. Use it to install HeadlessMc and to launch                                                                                                                                                                                                                           
              Minecraft headlessly with mod loaders (including MC-Runtime-Test for CI checks).                                                                                                                                                                                                                      
            
              Steps:                                                                                                                                                                                                                                                                                                
              1. Read the logs of the failed jobs with                                                                                                                                                                                                                                                              
                 `gh run view ${{ github.run_id }} --log-failed`.                                                                                                                                                                                                                                                   
              2. Find the cause. Typical causes: Minecraft API/mapping changes, loader                                                                                                                                                                                                                              
                 versions (Fabric loader/API, NeoForge, Forge) that don't exist yet or are                                                                                                                                                                                                                          
                 wrong in gradle.properties, a wrong Java version in ci-data.json, or                                                                                                                                                                                                                               
                 crashes on startup.                                                                                                                                                                                                                                                                                
              3. Fix only the directory of the new version (and ci-data.json/README if                                                                                                                                                                                                                              
                 needed). Do not modify directories of other Minecraft versions.                                                                                                                                                                                                                                    
              4. Verify that it builds with `./gradlew build` inside that directory (if it                                                                                                                                                                                                                          
                 has its own Gradle wrapper, use it).                                                                                                                                                                                                                                                               
              5. Verify that the mod launches: for every mod loader the new version is                                                                                                                                                                                                                              
                 built and tested for (see the build_data/run_data entries for it in                                                                                                                                                                                                                                
                 ci-data.json), use the headlessmc skill to launch Minecraft headlessly                                                                                                                                                                                                                             
                 with an offline account, that loader, the built mod jar and MC-Runtime-Test,                                                                                                                                                                                                                       
                 and check that the game starts, loads into a world and exits without a                                                                                                                                                                                                                             
                 crash. If it crashes, read the crash report/log, fix the cause and repeat.                                                                                                                                                                                                                         
              6. Commit with a message like `fix: <short description>` and push to                                                                                                                                                                                                                                  
                 `${{ github.head_ref }}`. In the commit message, list which loaders                                                                                                                                                                                                                                
                 you verified launch successfully.                                                                                                                                                                                                                                                                  
            
              If you cannot fix it (e.g. a loader has no release for this version yet),                                                                                                                                                                                                                             
              don't push anything. Instead, comment on the PR with                                                                                                                                                                                                                                                  
              `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,                                                                                                                                                                                                                                 
              explaining what fails, which loaders you tested and what is needed.                                                                                                                                                                                                                                   
              If a fix compiles but you could not get a launch to succeed for some loader,                                                                                                                                                                                                                          
              push the fix and comment on the PR which loaders still fail and why.
