plugins {
    id 'java'
    id 'maven-publish'
}

group 'me.earth.headlessmc'
version "${project_version}"

repositories {
    // mavenLocal()
    mavenCentral()
}

try {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
} catch (ignored) { // gradle 9

}

compileJava {
    if (JavaVersion.current().ordinal() > JavaVersion.VERSION_1_8.ordinal()) {
        options.compilerArgs.addAll(['--release', '8'])
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

// JLine 4 requires Java 11, the legacy version projects might build with Java 8
def canBuildJline4 = JavaVersion.current().isJava11Compatible()

// The jline3 and jline4 source sets compile the same sources (src/jline/java) against JLine 3 and JLine 4.
// They are packaged together with JLine into a bundle jar, which version projects can add to their jarLibs.
// At runtime the bundle is loaded on an isolated classloader, see me.earth.headlessmc.mc.console.JlineLoader.
sourceSets {
    jline3 {
        java.srcDirs = ['src/jline/java']
    }

    jline4 {
        java.srcDirs = ['src/jline/java']
    }
}

configurations {
    jline3Lib { transitive = false }
    jline4Lib { transitive = false }
    jline3CompileOnly.extendsFrom jline3Lib
    jline4CompileOnly.extendsFrom jline4Lib
    jline3Bundle {
        canBeConsumed = true
        canBeResolved = false
    }
    jline4Bundle {
        canBeConsumed = true
        canBeResolved = false
    }
}

compileJline3Java {
    if (JavaVersion.current().ordinal() > JavaVersion.VERSION_1_8.ordinal()) {
        options.release = 8
    }
}

compileJline4Java {
    options.release = 11 // JLine 4 requires Java 11
}

for (String jline : ['jline3', 'jline4']) {
    String name = jline
    SourceSet sourceSet = sourceSets.getByName(name)
    def implJar = tasks.register("${name}ImplJar", Jar) {
        archiveClassifier = "${name}-impl"
        from sourceSet.output
    }

    def indexTask = tasks.register("${name}BundleIndex") {
        def lib = configurations.getByName("${name}Lib")
        def output = layout.buildDirectory.file("${name}-bundle-index/index.txt")
        inputs.files(lib)
        outputs.file(output)
        doLast {
            def names = ['hmc-specifics-jline.jar'] + lib.files.collect { it.name }
            output.get().asFile.text = names.join('\n') + '\n'
        }
    }

    def bundleJar = tasks.register("${name}BundleJar", Jar) {
        archiveClassifier = "${name}-bundle"
        into('META-INF/hmc-specifics/jline') {
            from(implJar) {
                rename { 'hmc-specifics-jline.jar' }
            }
            from(configurations.getByName("${name}Lib"))
            from(indexTask)
        }
    }

    artifacts.add("${name}Bundle", bundleJar)
}

// A small mod that registers commands through the API, like other mods would, for the in-game tests in CI.
// See hmc-specifics-test.json. The stubs replace the classes of the modloaders and are not packaged.
// testModJar is written to build/libs of the root project, so that version projects upload it with their jars.
sourceSets {
    testModStubs
    testMod {
        compileClasspath += sourceSets.main.output + sourceSets.testModStubs.output
    }
}

configurations {
    testModCompileOnly.extendsFrom compileOnly, implementation
}

for (String name : ['compileTestModJava', 'compileTestModStubsJava']) {
    tasks.named(name, JavaCompile) {
        if (JavaVersion.current().ordinal() > JavaVersion.VERSION_1_8.ordinal()) {
            options.release = 8
        }
    }
}

def testModJar = tasks.register('testModJar', Jar) {
    group = 'build'
    archiveFileName = 'hmc-specifics-test-mod.jar'
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    from sourceSets.testMod.output
}

tasks.named('build') { dependsOn(testModJar) }

dependencies {
    compileOnly (group: 'net.minecrell', name: 'terminalconsoleappender', version: '1.3.0') {
        transitive false
    }

    compileOnly 'org.apache.logging.log4j:log4j-api:2.23.1'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.23.1'
    //compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9' // for testing compatibility with the 1.7.10 version
    //compileOnly 'org.apache.logging.log4j:log4j-core:2.0-beta9' // for testing compatibility with the 1.7.10 version

    implementation "io.github.headlesshq:headlessmc-console"
    implementation "io.github.headlesshq:headlessmc-exceptions:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-console:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-console-format:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-console-completions:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-auth:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-auth-all:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-auth-impl:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-auth-offline:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-auth-store-gson:${headlessmc_version}"
    implementation "io.github.headlesshq:headlessmc-commands-auth:${headlessmc_version}"
    implementation "info.picocli:picocli:${picocli_version}"

    implementation 'net.kyori:adventure-text-serializer-ansi:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-gson:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'

    jline3Lib "org.jline:jline:${jline3_version}"
    jline4Lib "org.jline:jline:${jline4_version}"
    jline3CompileOnly "io.github.headlesshq:headlessmc-console:${headlessmc_version}"
    jline4CompileOnly "io.github.headlesshq:headlessmc-console:${headlessmc_version}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly files(testModJar)
}

test {
    useJUnitPlatform()
    for (String jline : canBuildJline4 ? ['jline3', 'jline4'] : ['jline3']) {
        dependsOn("${jline}BundleJar")
        systemProperty "hmc.test.${jline}.bundle", tasks.named("${jline}BundleJar").get().archiveFile.get().asFile.absolutePath
    }
}

publishing {
    publications {
        "$project.name"(MavenPublication) {
            ((MavenPublication) it).groupId "${project.group}"
            ((MavenPublication) it).artifactId "hmc-specifics-api"
            ((MavenPublication) it).version "${project.version}"
            //noinspection GroovyAssignabilityCheck
            from components.java
        }
    }

    repositories {
        // mavenLocal()
        // maven {
        //     name = 'SomewhereOnThisMachine'
        //     url = 'file://...'
        // }

        maven {
            name = 'BuildDirMaven'
            url = rootProject.layout.buildDirectory.dir('maven')
        }

        if (System.getProperty("otherrepo") != null) {
            maven {
                name = 'otherrepo'
                url = "${System.getProperty("otherrepo")}"
            }
        }

        if (System.getenv('DEPLOY_TO_GITHUB_PACKAGES_URL') != null) {
            maven {
                name = 'GithubPagesMaven'
                url = System.getenv('DEPLOY_TO_GITHUB_PACKAGES_URL')
                credentials {
                    username = System.getenv('GITHUB_USER')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

publish {
    dependsOn(javadocJar)
    dependsOn(sourcesJar)
    dependsOn(build)
}
