pluginManagement {
    repositories {
        mavenCentral()
        maven {
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            url = "https://maven.neoforged.net/snapshots"
        }
        maven {
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url = "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/releases"
        }
        maven {
            url = "https://maven.wagyourtail.xyz/snapshots"
        }
        gradlePluginPortal() {
            content {
                excludeGroup("org.apache.logging.log4j")
            }
        }
    }
}

include 'hmc-specifics-api'
project(':hmc-specifics-api').projectDir = file('../../hmc-specifics-api')
include 'hmc-specifics-brigadier'
project(':hmc-specifics-brigadier').projectDir = file('../../hmc-specifics-brigadier')
include 'hmc-specifics-tweaker'
project(':hmc-specifics-tweaker').projectDir = file('../../hmc-specifics-tweaker')

rootProject.name = "hmc-specifics-${minecraft_version}"
